        { id: GAME_MODES.RACE_COLLECTIVE, name: 'Race + Collective', desc: 'Both goals must be completed', color: 'from-orange-400 to-orange-600', icon: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>' },
        { id: GAME_MODES.VERSUS, name: 'Versus', desc: 'Most points when timer ends wins', color: 'from-red-400 to-red-600', icon: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
        { id: GAME_MODES.SOLO, name: 'Solo', desc: 'Challenge yourself', color: 'from-green-400 to-green-600', icon: '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>' }
      ];

      let content = '';
      
      content += `<div class="flex justify-center gap-2 mb-6">`;
      [1, 2, 3, 4, 5].forEach(s => {
        const isActive = s === homeStep;
        const isPast = s < homeStep;
        content += `<div class="w-3 h-3 rounded-full ${isActive ? 'bg-green-500 scale-125' : isPast ? 'bg-green-400' : 'bg-white/30'}" style="${currentTheme === 'light' && !isActive && !isPast ? 'background: rgba(0,0,0,0.2);' : ''} ${isActive ? 'box-shadow: 0 0 10px rgba(34,197,94,0.5);' : ''}"></div>`;
      });
      content += `</div>`;

      if (homeStep === 1) {
        content += `<h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Choose Your Adventure</h2>`;
        content += `<div class="space-y-3">`;
        modes.forEach(m => {
          content += `
            <div class="mode-card ${homeMode === m.id ? 'selected' : ''}" data-mode="${m.id}">
              <div class="flex items-center gap-4">
                <div class="mode-icon bg-gradient-to-br ${m.color} text-white">${m.icon}</div>
                <div>
                  <div class="font-bold text-gray-900 text-lg">${m.name}</div>
                  <div class="text-sm text-gray-500">${m.desc}</div>
                </div>
              </div>
            </div>`;
        });
        content += `</div>`;
      }
      
      if (homeStep === 2) {
        content += `<h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Who's Playing?</h2>`;
        content += `
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-semibold mb-2 text-white-force text-dark-force">${homeMode === GAME_MODES.SOLO ? 'Your Name' : 'Player 1'}</label>
              <input type="text" id="player1Input" value="${homePlayer1}" class="input-field-dark text-lg">
            </div>
            ${homeMode !== GAME_MODES.SOLO ? `
              <div>
                <label class="block text-sm font-semibold mb-2 text-white-force text-dark-force">Player 2</label>
                <input type="text" id="player2Input" value="${homePlayer2}" class="input-field-dark text-lg">
              </div>
            ` : ''}
          </div>`;
      }
      
      if (homeStep === 3) {
        if (homeMode === GAME_MODES.VERSUS) {
          content += `<h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Set the Timer</h2>`;
          content += `
            <div class="space-y-4">
              <p class="text-center font-medium text-white-force text-dark-force">Most points when time runs out wins!</p>
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Days</label>
                  <input type="number" id="timerDays" value="${homeTimerDays}" min="0" class="input-field-dark text-center text-lg">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Hours</label>
                  <input type="number" id="timerHours" value="${homeTimerHours}" min="0" max="23" class="input-field-dark text-center text-lg">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Minutes</label>
                  <input type="number" id="timerMins" value="${homeTimerMins}" min="0" max="59" class="input-field-dark text-center text-lg">
                </div>
              </div>
            </div>`;
        } else {
          content += `<h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Set Your Goals</h2>`;
          content += `
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold mb-2 text-white-force text-dark-force">${homeMode === GAME_MODES.COLLECTIVE ? 'Team Goal' : 'Race Goal'} (points)</label>
                <input type="number" id="goalInput" value="${homeGoal}" class="input-field-dark text-xl text-center">
              </div>
              ${homeMode === GAME_MODES.RACE_COLLECTIVE ? `
                <div>
                  <label class="block text-sm font-semibold mb-2 text-white-force text-dark-force">Collective Goal (points)</label>
                  <input type="number" id="collectiveGoalInput" value="${homeCollectiveGoal || homeGoal * 2}" class="input-field-dark text-xl text-center">
                </div>
              ` : ''}
            </div>`;
        }
      }
      
      if (homeStep === 4 && homeMode !== GAME_MODES.VERSUS) {
        content += `<h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Set Timer</h2>`;
        content += `
          <div class="space-y-4">
            <label class="flex items-center gap-3 cursor-pointer rounded-xl p-4 border ${currentTheme === 'light' ? 'bg-white/80 border-gray-200' : 'bg-white/10 border-white/20'}">
              <input type="checkbox" id="noTimerCheck" ${homeNoTimer ? 'checked' : ''} class="w-5 h-5 rounded">
              <span class="font-semibold ${currentTheme === 'light' ? 'text-gray-900' : 'text-white'}">No timer (play until goal reached)</span>
            </label>
            <div id="timerInputs" class="${homeNoTimer ? 'opacity-40 pointer-events-none' : ''} grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Days</label>
                <input type="number" id="timerDays" value="${homeTimerDays}" min="0" class="input-field-dark text-center text-lg">
              </div>
              <div>
                <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Hours</label>
                <input type="number" id="timerHours" value="${homeTimerHours}" min="0" max="23" class="input-field-dark text-center text-lg">
              </div>
              <div>
                <label class="block text-xs font-semibold mb-2 text-white-force text-dark-force">Minutes</label>
                <input type="number" id="timerMins" value="${homeTimerMins}" min="0" max="59" class="input-field-dark text-center text-lg">
              </div>
            </div>
          </div>`;
      }
      
      if (homeStep === 5) {
        const timerText = homeMode === GAME_MODES.VERSUS ? 
          formatDuration((homeTimerDays * 24 * 60 + homeTimerHours * 60 + homeTimerMins) * 60 * 1000) :
          (homeNoTimer ? 'No timer' : formatDuration((homeTimerDays * 24 * 60 + homeTimerHours * 60 + homeTimerMins) * 60 * 1000));
        
        content += `
          <h2 class="text-xl font-bold text-center text-white-force text-dark-force mb-6">Ready to Begin?</h2>
          <div class="card">
            <h3 class="font-bold text-gray-900 mb-4 text-lg">Game Summary</h3>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Mode:</span><span class="font-bold text-gray-900">${modes.find(m => m.id === homeMode)?.name}</span></div>
              <div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Players:</span><span class="font-bold text-gray-900">${homePlayer1}${homeMode !== GAME_MODES.SOLO ? ' vs ' + homePlayer2 : ''}</span></div>
              ${homeMode === GAME_MODES.VERSUS ? `
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Duration:</span><span class="font-bold text-gray-900">${timerText}</span></div>
              ` : `
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Goal:</span><span class="font-bold text-gray-900">${homeGoal} pts</span></div>
                ${homeMode === GAME_MODES.RACE_COLLECTIVE ? `<div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Collective:</span><span class="font-bold text-gray-900">${homeCollectiveGoal || homeGoal * 2} pts</span></div>` : ''}
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg"><span class="text-gray-600">Timer:</span><span class="font-bold text-gray-900">${timerText}</span></div>
              `}
            </div>
          </div>`;
      }

      const totalMins = homeTimerDays * 24 * 60 + homeTimerHours * 60 + homeTimerMins;
      const canProceed = homeStep === 1 ? homeMode !== null :
                         homeStep === 2 ? (homeMode === GAME_MODES.SOLO ? homePlayer1.trim() : homePlayer1.trim() && homePlayer2.trim()) :
                         homeStep === 3 ? (homeMode === GAME_MODES.VERSUS ? totalMins >= 1 : homeGoal > 0) :
                         homeStep === 4 ? true :
                         homeStep === 5 ? true : false;

      return `
        <div class="min-h-screen p-4 pb-8">
          <div class="max-w-md mx-auto">
            <header class="text-center py-6">
              <h1 class="title-text text-3xl">Fitness Tracker</h1>
            </header>
            <div class="card-dark mb-6 fade-in">${content}</div>
            <div class="flex gap-3">
              ${homeStep > 1 ? `<button id="homeBack" class="btn-ghost flex-1">Back</button>` : ''}
              ${homeStep < 5 ? `<button id="homeNext" class="btn-primary flex-1" ${!canProceed ? 'disabled' : ''}>Next</button>` : `<button id="homeStart" class="btn-secondary flex-1" ${!canProceed ? 'disabled' : ''}>Start!</button>`}
            </div>
            <div class="flex justify-center gap-4 mt-6">
              <button id="goGames" class="btn-ghost">Games</button>
              <button id="goSettings" class="btn-ghost">Settings</button>
            </div>
          </div>
        </div>`;
    }

    function renderGames() {
      const activeGames = getActiveGames();
      const completedGames = getCompletedGames();
      
      let content = `
        <div class="flex gap-2 mb-6">
          <button class="tab-btn-light flex-1 ${gamesTab === 'active' ? 'active' : ''}" data-games-tab="active">Active (${activeGames.length})</button>
          <button class="tab-btn-light flex-1 ${gamesTab === 'completed' ? 'active' : ''}" data-games-tab="completed">Ended (${completedGames.length})</button>
        </div>`;
      
      if (gamesTab === 'active') {
        if (activeGames.length === 0) {
          content += `<div class="text-center py-16"><div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-100 flex items-center justify-center"><svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg></div><p class="font-bold text-lg text-white-force text-dark-force">No active games yet!</p><p class="text-white/60 text-gray-force mt-1">Start a new adventure</p></div>`;
        } else {
          content += `<div class="space-y-3">`;
          activeGames.forEach(g => {
            const isCurrent = g.id === state.activeGameId;
            content += `
              <div class="card flex items-center justify-between ${isCurrent ? 'ring-2 ring-green-500' : ''}" data-switch-game="${g.id}">
                <div class="flex-1 cursor-pointer">
                  <div class="font-bold text-gray-900 text-lg">${g.player1.name} vs ${g.player2?.name || 'AI'}</div>
                  <div class="text-green-600 font-bold">${g.player1.score} - ${g.player2?.score || 0} pts</div>
                </div>
                <button class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-semibold transition" data-end-game="${g.id}">End</button>
              </div>`;
          });
          content += `</div>`;
        }
      }
      
      if (gamesTab === 'completed') {
        if (completedGames.length === 0) {
          content += `<div class="text-center py-16"><div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gray-100 flex items-center justify-center"><svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg></div><p class="font-bold text-lg text-white-force text-dark-force">No ended games</p><p class="text-white/60 text-gray-force mt-1">Complete a game to see it here</p></div>`;
        } else {
          content += `<div class="space-y-3">`;
          completedGames.forEach(g => {
            content += `
              <div class="card">
                <div class="flex items-center justify-between mb-3">
                  <div class="font-bold text-gray-900">${g.player1.name} vs ${g.player2?.name || 'AI'}</div>
                  <button class="delete-btn" data-delete-completely="${g.id}">x</button>
                </div>
                <div class="text-green-600 font-bold mb-4">Winner: ${g.winner} - ${g.player1.score} - ${g.player2?.score || 0} pts</div>
                <div class="flex gap-2">
                  <button class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-semibold transition" data-view-game="${g.id}">View</button>
                  <button class="flex-1 py-2 bg-green-500 hover:bg-green-600 text-white rounded-xl font-semibold transition" data-revive-game="${g.id}">Revive</button>
                </div>
              </div>`;
          });
          content += `</div>`;
        }
      }
      
      return `
        <div class="min-h-screen p-4 pb-8">
          <div class="max-w-md mx-auto">
            <header class="text-center py-6"><h1 class="title-text text-3xl">Your Games</h1></header>
            <div class="card mb-6 fade-in">${content}</div>
            <div class="flex gap-3">
              <button id="goHome" class="btn-ghost flex-1">Back</button>
              <button id="newGameBtn" class="btn-primary flex-1">New Game</button>
            </div>
          </div>
        </div>`;
    }

    function renderGame() {
      const g = getCurrentGame();
      if (!g) { state.currentView = 'home'; render(); return ''; }
      
      const isP1Winning = g.player1.score > (g.player2?.score || 0);
      
      let timerDisplay = '';
      if (g.hasTimer && g.endTime) {
        timerDisplay = `<div id="timerDisplay" class="timer-display">${formatTime(g.endTime)}</div>`;
      }

      let scoreboard = '';
      if (g.collectiveGoal) {
        const collectivePct = Math.min(100, Math.round((g.collectiveScore / g.collectiveGoal) * 100));
        scoreboard += `
          <div class="collective-bar">
            <div class="text-center">
              <span class="text-sm font-semibold opacity-80">Collective Goal</span>
              <div class="text-3xl font-bold">${g.collectiveScore} <span class="text-lg opacity-70">/ ${g.collectiveGoal}</span></div>
            </div>
            <div class="progress-bar mt-3" style="background: rgba(255,255,255,0.2);"><div class="progress-fill" style="width:${collectivePct}%;background: white;"></div></div>
          </div>`;
      }
      
      if (g.mode !== GAME_MODES.COLLECTIVE) {
        scoreboard += `
          <div class="space-y-3">
            <div class="player-card ${isP1Winning ? 'winning' : ''}">
              <div class="flex justify-between items-center">
                <span class="font-bold text-gray-900 text-lg">${g.player1.name}</span>
                <span class="text-3xl font-bold text-green-600">${g.player1.score}</span>
              </div>
              <div class="progress-bar mt-3"><div class="progress-fill" style="width:${Math.min(100, (g.player1.score / g.goal) * 100)}%"></div></div>
            </div>
            ${g.player2 ? `
              <div class="player-card ${!isP1Winning && g.player2.score !== g.player1.score ? 'winning' : ''}">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-gray-900 text-lg">${g.player2.name}</span>
                  <span class="text-3xl font-bold text-green-600">${g.player2.score}</span>
                </div>
                <div class="progress-bar mt-3"><div class="progress-fill" style="width:${Math.min(100, (g.player2.score / g.goal) * 100)}%"></div></div>
              </div>
            ` : ''}
          </div>`;
      } else {
        const pct = Math.min(100, Math.round((g.collectiveScore / g.goal) * 100));
        scoreboard = `
          <div class="text-center mb-3"><span class="text-sm font-semibold text-gray-600">Team Score</span><div class="text-4xl font-bold text-green-600">${g.collectiveScore}</div></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="text-center text-xs font-semibold text-gray-500 mt-2">${g.collectiveScore} / ${g.goal} pts</div>`;
      }

      let tabContent = '';
      if (gameTab === 'game') {
        const players = g.mode === GAME_MODES.SOLO ? [g.player1.name] : [g.player1.name, g.player2?.name].filter(Boolean);
        tabContent = `
          <div class="card mb-6 fade-in text-center">
            <h3 class="text-lg font-bold text-gray-900 mb-6">Voice Input</h3>
            <div class="flex flex-col items-center">
              <button id="micBtn" class="mic-btn ${isRecording ? 'recording' : ''}">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
              </button>
              <p class="text-sm text-gray-600 mt-4 font-medium">${isRecording ? 'Listening...' : 'Tap to speak your activity'}</p>
            </div>
          </div>
          <div class="card fade-in">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Manual Entry</h3>
            <div class="space-y-3">
              <select id="manualPlayer" class="input-field font-semibold">${players.map(p => `<option value="${p}">${p}</option>`).join('')}</select>
              <input type="text" id="manualActivity" placeholder="Activity (e.g., 50 pushups)" class="input-field">
              <input type="number" id="manualPoints" placeholder="Points" class="input-field font-semibold text-center text-xl" step="0.5">
              <button id="manualSubmit" class="btn-primary w-full">Add Activity</button>
            </div>
          </div>`;
      }
      
      if (gameTab === 'scoreboard') {
        tabContent = `<div class="fade-in">${scoreboard}</div>`;
      }
      
      if (gameTab === 'history') {
        const allHistory = g.collectiveGoal ? 
          g.collectiveHistory.map(h => ({ ...h, playerName: h.player })) :
          [...g.player1.history.map(h => ({ ...h, playerName: g.player1.name })), 
           ...(g.player2?.history || []).map(h => ({ ...h, playerName: g.player2.name }))]
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        tabContent = `
          <div class="fade-in">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Activity History</h3>
            ${allHistory.length === 0 ? '<p class="text-gray-500 text-center py-8 font-medium">No activities yet</p>' :
              allHistory.map(h => `
                <div class="history-item">
                  <div>
                    <div class="font-bold text-gray-900">${h.playerName}</div>
                    <div class="text-sm text-gray-500">${h.details || h.activity}</div>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="font-bold text-green-600 text-xl">+${h.points}</span>
                    <button class="delete-btn" data-delete="${h.id}" data-player="${h.playerName}">x</button>
                  </div>
                </div>
              `).join('')
            }
          </div>`;
      }
      
      if (gameTab === 'dev') {
        let timerEditHtml = '';
        if (g.hasTimer && g.endTime) {
          const now = new Date();
          const end = new Date(g.endTime);
          const diffMs = end - now;
          const remainingMins = Math.max(0, Math.floor(diffMs / 60000));
          const remainingSecs = Math.max(0, Math.floor((diffMs % 60000) / 1000));
          timerEditHtml = `
            <div class="card mb-4" style="background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); border: 2px solid #7dd3fc;">
              <h3 class="text-lg font-bold text-blue-800 mb-4">Timer Settings</h3>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Minutes Remaining</label>
                  <input type="number" id="devTimerMins" value="${remainingMins}" min="0" class="input-field font-semibold text-center">
                </div>
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Seconds Remaining</label>
                  <input type="number" id="devTimerSecs" value="${remainingSecs}" min="0" max="59" class="input-field font-semibold text-center">
                </div>
              </div>
              <button id="devUpdateTimer" class="btn-primary w-full mt-4">Update Timer</button>
            </div>`;
        }
        
        tabContent = `
          <div class="fade-in space-y-4">
            ${timerEditHtml}
            <div class="card" style="background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border: 2px solid #fed7aa;">
              <h3 class="text-lg font-bold text-orange-800 mb-4">Dev Mode</h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Player 1 Name</label>
                  <input type="text" id="devPlayer1Name" value="${g.player1.name}" class="input-field">
                </div>
                ${g.player2 ? `<div><label class="block text-sm font-semibold text-gray-700 mb-2">Player 2 Name</label><input type="text" id="devPlayer2Name" value="${g.player2.name}" class="input-field"></div>` : ''}
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-sm font-semibold text-gray-700 mb-2">P1 Score</label><input type="number" id="devPlayer1Score" value="${g.player1.score}" class="input-field font-semibold text-center"></div>
                  ${g.player2 ? `<div><label class="block text-sm font-semibold text-gray-700 mb-2">P2 Score</label><input type="number" id="devPlayer2Score" value="${g.player2.score}" class="input-field font-semibold text-center"></div>` : ''}
                </div>
                ${g.collectiveGoal ? `<div><label class="block text-sm font-semibold text-gray-700 mb-2">Collective Score</label><input type="number" id="devCollectiveScore" value="${g.collectiveScore}" class="input-field font-semibold"></div>` : ''}
                <div><label class="block text-sm font-semibold text-gray-700 mb-2">Goal</label><input type="number" id="devGoal" value="${g.goal}" class="input-field font-semibold"></div>
                <button id="devSave" class="btn-primary w-full">Save Changes</button>
              </div>
            </div>
            <div class="card" style="background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%); border: 2px solid #fecaca;">
              <h3 class="text-lg font-bold text-red-800 mb-4">Danger Zone</h3>
              <button id="devEndGame" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-semibold transition">End This Game</button>
            </div>
          </div>`;
      }

      return `
        <div class="min-h-screen flex flex-col">
          <div class="p-4">
            <div class="flex items-center justify-between mb-4">
              <button id="goGamesFromGame" class="btn-ghost">Back</button>
            </div>
            <div class="card mb-4">${timerDisplay}${scoreboard}</div>
          </div>
          <div class="${currentTheme === 'light' ? 'bg-black/5' : 'bg-black/20'} backdrop-blur-sm">
            <div class="flex max-w-md mx-auto p-2">
              <button class="tab-btn ${gameTab === 'game' ? 'active' : ''}" data-tab="game">Log</button>
              <button class="tab-btn ${gameTab === 'scoreboard' ? 'active' : ''}" data-tab="scoreboard">Scores</button>
              <button class="tab-btn ${gameTab === 'history' ? 'active' : ''}" data-tab="history">History</button>
              <button class="tab-btn ${gameTab === 'dev' ? 'active' : ''}" data-tab="dev">Dev</button>
            </div>
          </div>
          <div class="flex-1 p-4 overflow-auto">
            <div class="max-w-md mx-auto">${tabContent}</div>
          </div>
          <div class="p-4 ${currentTheme === 'light' ? 'bg-black/5' : 'bg-black/20'} backdrop-blur-sm">
            <div class="max-w-md mx-auto">
              <button id="endGame" class="w-full py-4 bg-white/90 hover:bg-white text-gray-700 rounded-xl font-semibold border border-gray-200 transition">End Game</button>
            </div>
          </div>
        </div>`;
    }

    function renderWin() {
      const g = getCurrentGame();
      if (!g) { state.currentView = 'home'; render(); return ''; }
      
      return `
        <div class="min-h-screen flex items-center justify-center p-4">
          <div class="card max-w-md w-full text-center fade-in">
            <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center shadow-lg" style="animation: pulse 2s infinite;">
              <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">${g.winner === 'Team' ? 'Team Victory!' : g.winner === 'Tie' ? "It's a Tie!" : g.winner + ' Wins!'}</h1>
            
            <div class="mt-8 mb-8 space-y-3">
              <div class="flex justify-between p-4 rounded-xl ${g.winner === g.player1.name ? 'bg-green-50 ring-2 ring-green-500' : 'bg-gray-50'}">
                <span class="font-bold text-gray-900">${g.player1.name}</span>
                <span class="text-2xl font-bold text-green-600">${g.player1.score} pts</span>
              </div>
              ${g.player2 ? `
                <div class="flex justify-between p-4 rounded-xl ${g.winner === g.player2.name ? 'bg-green-50 ring-2 ring-green-500' : 'bg-gray-50'}">
                  <span class="font-bold text-gray-900">${g.player2.name}</span>
                  <span class="text-2xl font-bold text-green-600">${g.player2.score} pts</span>
                </div>
              ` : ''}
            </div>
            
            <div class="space-y-3">
              <button id="continueGame" class="btn-primary w-full">Continue Playing</button>
              <button id="newGame" class="btn-secondary w-full">New Game</button>
              <button id="viewDetails" class="btn-outline w-full">View Details</button>
            </div>
          </div>
        </div>`;
    }

    // ============== EVENT LISTENERS ==============
    function attachEventListeners() {
      document.getElementById('saveSettings')?.addEventListener('click', () => {
        state.settings.veniceKey = document.getElementById('veniceKey').value;
        state.settings.supabaseUrl = document.getElementById('supabaseUrl').value;
        state.settings.supabaseKey = document.getElementById('supabaseKey').value;
        saveSettings();
        resetSupabaseClient();
        state.currentView = 'home';
        render();
      });

      document.getElementById('syncFromCloud')?.addEventListener('click', () => {
        forceSyncFromCloud();
      });

      document.getElementById('syncToCloud')?.addEventListener('click', () => {
        forceSyncToCloud();
      });

      document.getElementById('backFromSettings')?.addEventListener('click', () => {
        const savedGames = localStorage.getItem('fitness_games');
        if (savedGames) state.games = JSON.parse(savedGames);
        const savedActiveId = localStorage.getItem('active_game_id');
        if (savedActiveId && state.games[savedActiveId]) state.activeGameId = savedActiveId;
        state.currentView = 'home';
        render();
      });

      document.getElementById('goSettings')?.addEventListener('click', () => { state.currentView = 'settings'; render(); });
      document.getElementById('goGames')?.addEventListener('click', () => { state.currentView = 'games'; render(); });
      document.getElementById('goHome')?.addEventListener('click', () => { state.currentView = 'home'; render(); });
      document.getElementById('goGamesFromGame')?.addEventListener('click', () => { stopTimer(); state.currentView = 'games'; render(); });
      document.getElementById('newGameBtn')?.addEventListener('click', () => { homeStep = 1; homeMode = null; state.currentView = 'home'; render(); });

      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => { homeMode = btn.dataset.mode; render(); });
      });

      document.querySelectorAll('[data-games-tab]').forEach(btn => {
        btn.addEventListener('click', () => { gamesTab = btn.dataset.gamesTab; render(); });
      });

      document.querySelectorAll('[data-switch-game]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn') || e.target.closest('[data-end-game]')) return;
          switchToGame(el.dataset.switchGame);
        });
      });

      document.querySelectorAll('[data-end-game]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const game = state.games[btn.dataset.endGame];
          if (game) {
            game.status = 'completed';
            if (!game.winner) game.winner = game.player1.score > (game.player2?.score || 0) ? game.player1.name : game.player2?.name || 'Tie';
            if (state.activeGameId === btn.dataset.endGame) state.activeGameId = null;
            saveGame();
            render();
          }
        });
      });

      document.querySelectorAll('[data-delete-completely]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Permanently delete this game?')) {
            delete state.games[btn.dataset.deleteCompletely];
            if (state.activeGameId === btn.dataset.deleteCompletely) state.activeGameId = null;
            saveGame();
            render();
          }
        });
      });

      document.querySelectorAll('[data-view-game]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeGameId = btn.dataset.viewGame;
          saveGame();
          state.currentView = 'win';
          render();
        });
      });

      document.querySelectorAll('[data-revive-game]').forEach(btn => {
        btn.addEventListener('click', () => {
          const game = state.games[btn.dataset.reviveGame];
          if (game) {
            game.status = 'active';
            game.winner = null;
            game.raceWinner = null;
            game.collectiveComplete = false;
            state.activeGameId = btn.dataset.reviveGame;
            saveGame();
            speak(getRandomResponse('revived'));
            state.currentView = 'game';
            gameTab = 'game';
            render();
          }
        });
      });

      document.getElementById('noTimerCheck')?.addEventListener('change', (e) => {
        homeNoTimer = e.target.checked;
        document.getElementById('timerInputs')?.classList.toggle('opacity-40', homeNoTimer);
        document.getElementById('timerInputs')?.classList.toggle('pointer-events-none', homeNoTimer);
      });

      document.getElementById('homeBack')?.addEventListener('click', () => {
        if (homeStep > 1) {
          if (homeMode === GAME_MODES.VERSUS && homeStep === 5) homeStep = 3;
          else homeStep--;
          render();
        }
      });

      document.getElementById('homeNext')?.addEventListener('click', () => {
        if (homeStep === 2) {
          homePlayer1 = document.getElementById('player1Input')?.value || homePlayer1;
          homePlayer2 = document.getElementById('player2Input')?.value || homePlayer2;
        }
        if (homeStep === 3) {
          if (homeMode === GAME_MODES.VERSUS) {
            homeTimerDays = parseInt(document.getElementById('timerDays')?.value) || 0;
            homeTimerHours = parseInt(document.getElementById('timerHours')?.value) || 0;
            homeTimerMins = parseInt(document.getElementById('timerMins')?.value) || 0;
          } else {
            homeGoal = parseInt(document.getElementById('goalInput')?.value) || homeGoal;
            homeCollectiveGoal = parseInt(document.getElementById('collectiveGoalInput')?.value) || null;
          }
        }
        if (homeStep === 4) {
          homeTimerDays = parseInt(document.getElementById('timerDays')?.value) || 0;
          homeTimerHours = parseInt(document.getElementById('timerHours')?.value) || 0;
          homeTimerMins = parseInt(document.getElementById('timerMins')?.value) || 0;
        }
        if (homeStep < 5) {
          if (homeMode === GAME_MODES.VERSUS && homeStep === 3) homeStep = 5;
          else homeStep++;
          render();
        }
      });

      document.getElementById('homeStart')?.addEventListener('click', () => {
        if (getActiveGames().length >= 5) { speak("You already have 5 active games!"); return; }
        
        const totalMs = (homeTimerDays * 24 * 60 + homeTimerHours * 60 + homeTimerMins) * 60 * 1000;
        const hasTimer = homeMode === GAME_MODES.VERSUS ? true : (!homeNoTimer && totalMs > 0);
        
        const newGame = createGame(homeMode, {
          player1Name: homePlayer1.trim() || 'Player 1',
          player2Name: homePlayer2.trim() || 'Player 2',
          goal: homeGoal,
          collectiveGoal: homeMode === GAME_MODES.RACE_COLLECTIVE ? (homeCollectiveGoal || homeGoal * 2) : (homeMode === GAME_MODES.COLLECTIVE ? homeGoal : null),
          hasTimer: hasTimer,
          endTime: hasTimer ? new Date(Date.now() + totalMs).toISOString() : null
        });
        
        state.games[newGame.id] = newGame;
        state.activeGameId = newGame.id;
        saveGame();
        state.currentView = 'game';
        gameTab = 'game';
        render();
        speak(getRandomResponse('gameStart'));
        if (hasTimer) startTimer();
      });

      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => { gameTab = btn.dataset.tab; render(); });
      });

      document.getElementById('micBtn')?.addEventListener('click', startVoiceRecognition);

      document.getElementById('manualSubmit')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (!g) return;
        const player = document.getElementById('manualPlayer').value;
        const activity = document.getElementById('manualActivity').value;
        const points = parseFloat(document.getElementById('manualPoints').value);
        
        if (activity && points > 0) {
          addActivity(g, player, { activity, details: activity, intensity: 'normal', points });
          document.getElementById('manualActivity').value = '';
          document.getElementById('manualPoints').value = '';
          speak(getRandomResponse(points >= 50 ? 'successHigh' : 'success'));
          if (g.status === 'completed') { state.currentView = 'win'; fireConfetti(); setTimeout(() => speak(getRandomResponse('winner')), 500); }
          render();
        }
      });

      document.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          const g = getCurrentGame();
          if (!g) return;
          removeActivity(g, btn.dataset.player, parseInt(btn.dataset.delete));
          speak(getRandomResponse('activityDelete'));
          render();
        });
      });

      document.getElementById('endGame')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (g) {
          g.status = 'completed';
          if (!g.winner) g.winner = g.player1.score > (g.player2?.score || 0) ? g.player1.name : g.player2?.name || 'Tie';
        }
        state.activeGameId = null;
        stopTimer();
        saveGame();
        state.currentView = 'home';
        render();
      });

      document.getElementById('devSave')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (!g) return;
        g.player1.name = document.getElementById('devPlayer1Name')?.value || g.player1.name;
        g.player1.score = parseFloat(document.getElementById('devPlayer1Score')?.value) || 0;
        if (g.player2) {
          g.player2.name = document.getElementById('devPlayer2Name')?.value || g.player2.name;
          g.player2.score = parseFloat(document.getElementById('devPlayer2Score')?.value) || 0;
        }
        if (g.collectiveGoal) g.collectiveScore = parseFloat(document.getElementById('devCollectiveScore')?.value) || 0;
        g.goal = parseInt(document.getElementById('devGoal')?.value) || g.goal;
        saveGame();
        speak("Changes saved!");
        render();
      });

      document.getElementById('devUpdateTimer')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (!g || !g.hasTimer) return;
        
        const mins = parseInt(document.getElementById('devTimerMins')?.value) || 0;
        const secs = parseInt(document.getElementById('devTimerSecs')?.value) || 0;
        const totalMs = (mins * 60 + secs) * 1000;
        
        g.endTime = new Date(Date.now() + totalMs).toISOString();
        saveGame();
        speak("Timer updated!");
        render();
      });

      document.getElementById('devEndGame')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (g) {
          g.status = 'completed';
          if (!g.winner) g.winner = g.player1.score > (g.player2?.score || 0) ? g.player1.name : g.player2?.name || 'Tie';
        }
        state.activeGameId = null;
        stopTimer();
        saveGame();
        gamesTab = 'completed';
        state.currentView = 'games';
        render();
      });

      document.getElementById('continueGame')?.addEventListener('click', () => {
        const g = getCurrentGame();
        if (!g) return;
        g.status = 'active';
        g.winner = null;
        saveGame();
        state.currentView = 'game';
        gameTab = 'game';
        render();
        if (g.hasTimer) startTimer();
      });

      document.getElementById('newGame')?.addEventListener('click', () => {
        stopTimer();
        state.activeGameId = null;
        homeStep = 1;
        homeMode = null;
        homeNoTimer = true;
        state.currentView = 'home';
        render();
      });

      document.getElementById('viewDetails')?.addEventListener('click', () => {
        state.currentView = 'game';
        gameTab = 'history';
        render();
      });
    }

    // ============== VOICE RECOGNITION ==============
    let recognition = null;
    let silenceTimer = null;
    let finalTranscriptBuffer = '';

    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        speak("Your browser doesn't support voice recognition. Try Chrome.");
        return;
      }

      // If already recording, stop it
      if (isRecording && recognition) {
        recognition.stop();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      finalTranscriptBuffer = '';

      recognition.onstart = () => { 
        isRecording = true; 
        showVoiceStatus('Listening... Speak now', 10000);
        render(); 
      };

      recognition.onend = () => { 
        isRecording = false;
        if (silenceTimer) clearTimeout(silenceTimer);
        
        // Process any remaining transcript when recognition ends
        if (finalTranscriptBuffer.trim()) {
          showVoiceStatus(`Processing: "${finalTranscriptBuffer.trim()}"`, 5000);
          processSpeech(finalTranscriptBuffer.trim());
          finalTranscriptBuffer = '';
        }
        render(); 
      };

      recognition.onresult = async (event) => {
        // Clear the silence timer on new speech
        if (silenceTimer) clearTimeout(silenceTimer);

        let interimTranscript = '';
        
        // Collect all results
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscriptBuffer += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        // Show interim results
        const displayText = finalTranscriptBuffer + interimTranscript;
        if (displayText) {
          showVoiceStatus(`"${displayText}"`, 10000);
        }

        // Set timer to process after 3 seconds of silence
        silenceTimer = setTimeout(async () => {
          if (recognition) {
            try {
              recognition.stop();
            } catch (e) {
              // Already stopped
            }
          }
          
          // Process final transcript
          const toProcess = finalTranscriptBuffer.trim();
          finalTranscriptBuffer = '';
          
          if (toProcess) {
            showVoiceStatus(`Processing: "${toProcess}"`, 5000);
            await processSpeech(toProcess);
          }
        }, 3000);
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        isRecording = false;
        if (silenceTimer) clearTimeout(silenceTimer);
        
        if (event.error === 'not-allowed') {
          speak("I need microphone permission. Please allow it in your browser settings.");
        } else if (event.error === 'no-speech') {
          showVoiceStatus('No speech detected. Try again.', 3000);
        } else if (event.error === 'aborted') {
          // On mobile, this often happens - process whatever we have
          if (finalTranscriptBuffer.trim()) {
            showVoiceStatus(`Processing: "${finalTranscriptBuffer.trim()}"`, 5000);
            processSpeech(finalTranscriptBuffer.trim());
            finalTranscriptBuffer = '';
          } else {
            showVoiceStatus('Recognition aborted. Try again.', 3000);
          }
        } else if (event.error === 'network') {
          speak("Network error. Check your connection.");
        } else {
          showVoiceStatus(`Error: ${event.error}`, 3000);
        }
        render();
      };

      try {
        recognition.start();
      } catch (e) {
        console.error('Failed to start recognition:', e);
        showVoiceStatus('Failed to start voice. Try again.', 3000);
      }
    }

    async function processSpeech(speech) {
      showVoiceStatus(`Processing: "${speech}"`, 5000);
      
      const g = getCurrentGame();
      if (!g) { speak("No active game! Start a game first."); return; }
      
      const playerNames = [g.player1.name, g.player2?.name].filter(Boolean);
      const result = await parseWithVenice(speech, playerNames);
      
      if (!result.success) {
        if (result.error === 'no_api_key') speak(getRandomResponse('noApiKey'));
        else if (result.needsClarification) speak(result.question);
        else speak(getRandomResponse('notUnderstood'));
        return;
      }

      let player = result.data.player;
      
      if (!player && g.mode === GAME_MODES.SOLO) player = g.player1.name;
      else if (!player) player = fuzzyMatchPlayer(speech, g);
      
      if (!player) { speak(getRandomResponse('unknownPlayer')); return; }

      let matchedPlayer = fuzzyMatchPlayerName(player, g);
      if (!matchedPlayer && g.player1.name.toLowerCase() === player.toLowerCase()) matchedPlayer = g.player1.name;
      if (!matchedPlayer && g.player2 && g.player2.name.toLowerCase() === player.toLowerCase()) matchedPlayer = g.player2.name;
      
      if (!matchedPlayer) { speak(getRandomResponse('unknownPlayer')); return; }

      addActivity(g, matchedPlayer, result.data);

      speak(getRandomResponse(result.data.points >= 50 ? 'successHigh' : 'success'));
      showVoiceStatus(`${matchedPlayer}: +${result.data.points} pts`, 3000);

      if (g.status === 'completed') {
        state.currentView = 'win';
        fireConfetti();
        setTimeout(() => speak(getRandomResponse('winner')), 500);
      }
      render();
    }

    // ============== CONFETTI ==============
    function fireConfetti() {
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#22c55e', '#fbbf24', '#38bdf8', '#f472b6', '#a78bfa'] });
      setTimeout(() => {
        confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#22c55e', '#fbbf24', '#38bdf8'] });
        confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#22c55e', '#fbbf24', '#38bdf8'] });
      }, 250);
    }

    // ============== TIMER ==============
    let timerInterval = null;
    
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        const g = getCurrentGame();
        if (g && g.hasTimer && g.endTime && state.currentView === 'game') {
          const diff = new Date(g.endTime) - new Date();

          const timerEl = document.getElementById('timerDisplay');
          if (timerEl) timerEl.textContent = formatTime(g.endTime);

          if (diff <= 0 && g.status === 'active') {
            clearInterval(timerInterval);
            checkWinner(g);
            saveGame();
            if (g.status === 'completed') {
              state.currentView = 'win';
              fireConfetti();
              setTimeout(() => speak(getRandomResponse('winner')), 500);
              render();
            }
          }
        }
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    // ============== INIT ==============
    initBgPicker();
    loadGame().then(() => {
      if (state.settings.veniceKey) {
        const g = getCurrentGame();
        if (g && g.status === 'active') state.currentView = 'game';
        else state.currentView = 'home';
      }
      render();
      const g = getCurrentGame();
      if (g && g.hasTimer) startTimer();
    });
  </script>
