<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fitness Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    body {
      min-height: 100vh;
      position: relative;
      transition: background 0.3s;
    }
    
    .bg-image {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
      transition: opacity 0.5s, background-image 0.5s;
    }
    
    .bg-overlay-dark {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.3s;
    }
    
    .bg-overlay-light {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.6) 100%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    body.light-mode .bg-overlay-dark { opacity: 0; }
    body.light-mode .bg-overlay-light { opacity: 1; }
    
    .app-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
    }
    
    .card {
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      padding: 28px;
      transition: background 0.3s, color 0.3s;
    }
    
    body.light-mode .card {
      background: rgba(255,255,255,0.98);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.15);
    }
    
    .card-dark {
      background: rgba(30,41,59,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.3s;
    }
    
    body.light-mode .card-dark {
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px -5px rgba(34,197,94,0.4);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-secondary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px -5px rgba(245,158,11,0.4);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .btn-secondary:hover { transform: translateY(-2px); }
    
    .btn-outline {
      background: rgba(255,255,255,0.95);
      color: #16a34a;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 14px;
      border: 2px solid #22c55e;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .btn-outline:hover { background: #f0fdf4; transform: translateY(-2px); }
    
    body.light-mode .btn-outline {
      background: white;
      color: #16a34a;
    }
    
    .btn-ghost {
      background: rgba(255,255,255,0.15);
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.25); }
    
    body.light-mode .btn-ghost {
      background: rgba(0,0,0,0.05);
      color: #1e293b;
      border-color: rgba(0,0,0,0.1);
    }
    body.light-mode .btn-ghost:hover {
      background: rgba(0,0,0,0.1);
    }
    
    .input-field {
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #ffffff;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
      color: #1e293b;
    }
    .input-field:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.15);
    }
    
    .input-field-dark {
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      font-size: 16px;
      font-family: inherit;
      color: white;
      transition: all 0.2s;
      outline: none;
    }
    .input-field-dark::placeholder { color: rgba(255,255,255,0.5); }
    .input-field-dark:focus {
      border-color: #22c55e;
      background: rgba(255,255,255,0.15);
    }
    
    body.light-mode .input-field-dark {
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.15);
      color: #1e293b;
    }
    body.light-mode .input-field-dark::placeholder {
      color: rgba(0,0,0,0.4);
    }
    
    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 15px 40px -5px rgba(34,197,94,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn:active { transform: scale(0.98); }
    .mic-btn.recording {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 15px 40px -5px rgba(239,68,68,0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .mic-btn svg { width: 40px; height: 40px; color: white; }
    
    .progress-bar {
      height: 12px;
      border-radius: 6px;
      background: #e2e8f0;
      overflow: hidden;
    }
    body.light-mode .progress-bar {
      background: #e2e8f0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.5s ease-out;
    }
    
    .player-card {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 16px;
      padding: 20px;
      border: 2px solid #e2e8f0;
      transition: all 0.3s;
    }
    body.light-mode .player-card {
      background: white;
      border-color: #e2e8f0;
    }
    .player-card.winning {
      border-color: #fbbf24;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      box-shadow: 0 0 30px rgba(251,191,36,0.3);
    }
    
    .tab-btn {
      flex: 1;
      padding: 14px 16px;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s;
      background: transparent;
      color: rgba(255,255,255,0.6);
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .tab-btn.active {
      background: rgba(255,255,255,0.15);
      color: white;
    }
    
    body.light-mode .tab-btn {
      color: rgba(0,0,0,0.5);
    }
    body.light-mode .tab-btn.active {
      background: rgba(0,0,0,0.08);
      color: #1e293b;
    }
    
    .tab-btn-light {
      flex: 1;
      padding: 14px 16px;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s;
      background: #f1f5f9;
      color: #64748b;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .tab-btn-light.active {
      background: #22c55e;
      color: white;
    }
    
    .mode-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1); }
    .mode-card.selected { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
    
    .mode-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .mode-icon svg {
      width: 24px;
      height: 24px;
    }
    
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
    }
    body.light-mode .history-item {
      background: white;
    }
    .history-item:hover { background: #f1f5f9; }
    
    .delete-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: bold;
      font-size: 14px;
    }
    .delete-btn:hover { background: #fecaca; color: #b91c1c; }
    
    .voice-status {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.95);
      color: white;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      z-index: 1000;
      animation: fadeIn 0.3s;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    body.light-mode .voice-status {
      background: rgba(30,41,59,0.95);
    }
    
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .title-text {
      font-size: 2rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      transition: color 0.3s, text-shadow 0.3s;
    }
    body.light-mode .title-text {
      color: #1e293b;
      text-shadow: none;
    }
    
    .timer-display {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .collective-bar {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    
    .bg-picker-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .bg-picker-btn:hover { transform: scale(1.1); }
    .bg-picker-btn svg { width: 24px; height: 24px; color: #475569; }
    
    .bg-picker-panel {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 1000;
      background: rgba(255,255,255,0.98);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      padding: 20px;
      width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      display: none;
    }
    .bg-picker-panel.open { display: block; animation: fadeIn 0.3s; }
    
    .bg-option {
      width: 100%;
      height: 80px;
      border-radius: 12px;
      margin-bottom: 10px;
      background-size: cover;
      background-position: center;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .bg-option:hover { transform: scale(1.02); }
    .bg-option.selected { border-color: #22c55e; }
    .bg-option-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 0 0 9px 9px;
    }
    
    .theme-toggle {
      display: flex;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .theme-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      color: #64748b;
    }
    .theme-btn.active {
      background: white;
      color: #1e293b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .text-white-force { color: white !important; }
    body.light-mode .text-dark-force { color: #1e293b !important; }
    body.light-mode .text-gray-force { color: #64748b !important; }
  </style>
</head>
<body>
  <div id="bgImage" class="bg-image"></div>
  <div class="bg-overlay-dark"></div>
  <div class="bg-overlay-light"></div>
  
  <div class="app-container">
    <div id="app"></div>
    <div id="voiceStatus" class="voice-status" style="display: none;"></div>
  </div>
  
  <button id="bgPickerBtn" class="bg-picker-btn" title="Change Background">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
  </button>
  
  <div id="bgPickerPanel" class="bg-picker-panel">
    <div class="theme-toggle">
      <button class="theme-btn" data-theme="dark">Dark Mode</button>
      <button class="theme-btn active" data-theme="light">Light Mode</button>
    </div>
    <div id="bgOptions"></div>
  </div>

  <script>
    // ============== BACKGROUNDS ==============
    const backgrounds = [
      { id: 'mountains', name: 'Mountain Valley', url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80' },
      { id: 'balloons', name: 'Hot Air Balloons', url: 'https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=1920&q=80' },
      { id: 'sky', name: 'Blue Sky Clouds', url: 'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1920&q=80' },
      { id: 'sunset', name: 'Golden Sunset', url: 'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=1920&q=80' },
      { id: 'waterton', name: 'Waterton Lakes', url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80' },
      { id: 'redrock', name: 'Red Rock Canyon - Waterton', url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80' },
      { id: 'tulips', name: 'Dutch Tulip Fields', url: 'https://images.unsplash.com/photo-1463936575829-25148e1db1b8?w=1920&q=80' },
      { id: 'northernlights', name: 'Northern Lights', url: 'https://images.unsplash.com/photo-1483347756197-71ef80e95f73?w=1920&q=80' },
      { id: 'amsterdam', name: 'Amsterdam Canals', url: 'https://images.unsplash.com/photo-1534351590666-13e3e96b5017?w=1920&q=80' },
      { id: 'yosemite', name: 'Yosemite Valley', url: 'https://images.unsplash.com/photo-1472396961693-142e6e269027?w=1920&q=80' },
      { id: 'anfield', name: 'Anfield Stadium', url: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1920&q=80' },
      { id: 'angelfalls', name: 'Angel Falls', url: 'https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=1920&q=80' },
      { id: 'space', name: 'Space Galaxy', url: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80' },
      { id: 'hawaii', name: 'Hawaii Beach', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80' },
      { id: 'austria', name: 'Austria Alps', url: 'https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=1920&q=80' },
      { id: 'savannah', name: 'African Savannah', url: 'https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1920&q=80' },
      { id: 'golf', name: 'Golf Course Mountains', url: 'https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?w=1920&q=80' },
      { id: 'shire', name: 'Shire Green Hills', url: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1920&q=80' },
      { id: 'starwars', name: 'Star Wars Desert', url: 'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&q=80' },
      { id: 'forest', name: 'Misty Forest', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&q=80' },
      { id: 'lake', name: 'Calm Lake', url: 'https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=1920&q=80' }
    ];
    
    let currentBg = localStorage.getItem('selected_bg') || 'mountains';
    let currentTheme = localStorage.getItem('selected_theme') || 'light';
    
    function applyBackground(bgId) {
      const bg = backgrounds.find(b => b.id === bgId) || backgrounds[0];
      document.getElementById('bgImage').style.backgroundImage = `url('${bg.url}')`;
      currentBg = bgId;
      localStorage.setItem('selected_bg', bgId);
      
      document.querySelectorAll('.bg-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.bgId === bgId);
      });
    }
    
    function applyTheme(theme) {
      document.body.classList.toggle('light-mode', theme === 'light');
      currentTheme = theme;
      localStorage.setItem('selected_theme', theme);
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }
    
    function initBgPicker() {
      const panel = document.getElementById('bgPickerPanel');
      const btn = document.getElementById('bgPickerBtn');
      const optionsContainer = document.getElementById('bgOptions');
      
      let html = '';
      backgrounds.forEach(bg => {
        html += `
          <div class="bg-option ${bg.id === currentBg ? 'selected' : ''}" 
               data-bg-id="${bg.id}" 
               style="background-image: url('${bg.url}')">
            <div class="bg-option-label">${bg.name}</div>
          </div>
        `;
      });
      optionsContainer.innerHTML = html;
      
      btn.addEventListener('click', () => {
        panel.classList.toggle('open');
      });
      
      document.querySelectorAll('.bg-option').forEach(el => {
        el.addEventListener('click', () => {
          applyBackground(el.dataset.bgId);
        });
      });
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyTheme(btn.dataset.theme);
        });
      });
      
      document.addEventListener('click', (e) => {
        if (!panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('open');
        }
      });
      
      applyBackground(currentBg);
      applyTheme(currentTheme);
    }
    
    // ============== STATE ==============
    const state = {
      currentView: 'settings',
      settings: {
        veniceKey: localStorage.getItem('venice_api_key') || '',
        supabaseUrl: localStorage.getItem('supabase_url') || '',
        supabaseKey: localStorage.getItem('supabase_key') || ''
      },
      games: {},
      activeGameId: null
    };
    
    function getCurrentGame() {
      return state.activeGameId ? state.games[state.activeGameId] : null;
    }

    const GAME_MODES = { 
      RACE: 'race', 
      COLLECTIVE: 'collective', 
      RACE_COLLECTIVE: 'race_collective',
      SOLO: 'solo',
      VERSUS: 'versus'
    };

    // ============== VOICE RESPONSES ==============
    const recentResponses = [];
    const MAX_RECENT = 10;
    
    const voiceResponses = {
      success: [
        "Absolutely magnificent! Logged it straight away.",
        "Splendid work! That's been recorded for posterity.",
        "Another classic effort! I do admire your dedication.",
        "Brilliant, absolutely brilliant. Consider it logged.",
        "There we are, safe and sound in the records. Jolly good show!",

    function getRandomResponse(type) {
      const roll = Math.random() * 1000000;
      
      if (type === 'success') {
        if (roll < 1) return { text: voiceResponses.legendaryMillion[0], special: 'million' };
        if (roll < 1000) return { text: voiceResponses.legendary1000[0], special: 'thousand' };
        if (roll < 10000) return { text: voiceResponses.legendary100[0], special: 'hundred' };
      }
      
      const responses = voiceResponses[type] || voiceResponses.success;
      const available = responses.filter(r => !recentResponses.includes(r));
      
      if (available.length === 0) {
        recentResponses.length = 0;
        return { text: responses[Math.floor(Math.random() * responses.length)] };
      }
      
      const selected = available[Math.floor(Math.random() * available.length)];
      recentResponses.push(selected);
      if (recentResponses.length > MAX_RECENT) recentResponses.shift();
      
      return { text: selected };
    }

    let currentAudio = null;

    async function speak(responseOrText) {
      const response = typeof responseOrText === 'string' ? { text: responseOrText } : responseOrText;
      const text = response.text;
      
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }

      if (response.special === 'million') {
        const g = getCurrentGame();
        if (g) { g.player1.score += 10000; saveGame(); render(); }
        fireConfetti();
      }
      if (response.special === 'thousand') {
        const g = getCurrentGame();
        if (g) { g.player1.score += 1000; saveGame(); render(); }
        fireConfetti();
      }
      if (response.special === 'hundred') {
        const g = getCurrentGame();
        if (g) { g.player1.score += 100; saveGame(); render(); }
        fireConfetti();
      }

      if (!state.settings.veniceKey) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
        return;
      }

      try {
        const res = await fetch('https://api.venice.ai/api/v1/audio/speech', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.settings.veniceKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'tts-kokoro',
            input: text,
            voice: 'bm_george',
            response_format: 'mp3',
            speed: 0.85
          })
        });

        if (!res.ok) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.8;
          speechSynthesis.speak(utterance);
          return;
        }

        const audioBlob = await res.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        currentAudio = new Audio(audioUrl);
        currentAudio.play();
      } catch (error) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
      }
    }

    async function syncToCloud() {
      const client = getSupabase();
      if (!client) return { success: false, error: 'No client' };
      try {
        const { error } = await client.from('fitness_data').upsert({
          id: 'main',
          games: state.games,
          activeGameId: state.activeGameId,
          updated_at: new Date().toISOString()
        }, { onConflict: 'id' });
        if (error) {
          console.error('Sync error:', error);
          return { success: false, error: error.message };
        }
        console.log('Sync successful');
        return { success: true };
      } catch (err) {
        console.error('Sync failed:', err);
        return { success: false, error: err.message };
      }
    }

    async function loadFromCloud() {
      const client = getSupabase();
      if (!client) return { success: false, error: 'No client' };
      try {
        const { data, error } = await client.from('fitness_data').select('*').eq('id', 'main').single();
        if (error && error.code !== 'PGRST116') {
          console.error('Load error:', error);
          return { success: false, error: error.message };
        }
        if (data) {
          if (data.games) state.games = data.games;
          if (data.activeGameId) state.activeGameId = data.activeGameId;
          console.log('Loaded from cloud:', Object.keys(state.games).length, 'games');
          return { success: true };
        }
        return { success: false, error: 'No data' };
      } catch (err) {
        console.error('Load failed:', err);
        return { success: false, error: err.message };
      }
    }

    function createGame(mode, options = {}) {
      return {
        id: Date.now(),
        mode: mode,
        status: 'active',
        createdAt: new Date().toISOString(),
        endTime: options.endTime || null,
        hasTimer: options.hasTimer || false,
        goal: options.goal || 100,
        collectiveGoal: options.collectiveGoal || null,
        player1: { name: options.player1Name || 'Player 1', score: 0, history: [] },
        player2: { name: options.player2Name || 'Player 2', score: 0, history: [] },
        collectiveScore: 0,
        collectiveHistory: [],
        winner: null,
        raceWinner: null,
        collectiveComplete: false
      };
    }

    function addActivity(game, playerName, activity) {
      const entry = { ...activity, timestamp: new Date().toISOString(), id: Date.now() };
      
      if (playerName === game.player1.name) {
        game.player1.score += activity.points;
        game.player1.history.push(entry);
      } else if (game.player2 && playerName === game.player2.name) {
        game.player2.score += activity.points;
        game.player2.history.push(entry);
      }
      
      if (game.collectiveGoal) {
        game.collectiveScore += activity.points;
        game.collectiveHistory.push({ ...entry, player: playerName });
      }
      
      checkWinner(game);
      saveGame();
      return game;
    }

    function removeActivity(game, playerName, activityId) {
      if (game.collectiveGoal) {
        const idx = game.collectiveHistory.findIndex(h => h.id === activityId);
        if (idx !== -1) {
          game.collectiveScore -= game.collectiveHistory[idx].points;
          game.collectiveHistory.splice(idx, 1);
        }
      }
      
      const player = playerName === game.player1.name ? 'player1' : 'player2';
      const idx = game[player].history.findIndex(h => h.id === activityId);
      if (idx !== -1) {
        game[player].score -= game[player].history[idx].points;
        game[player].history.splice(idx, 1);
      }
      
      game.raceWinner = null;
      game.collectiveComplete = false;
      game.winner = null;
      game.status = 'active';
      checkWinner(game);
      saveGame();
      return game;
    }

    function checkWinner(game) {
      if (game.mode === GAME_MODES.RACE || game.mode === GAME_MODES.VERSUS) {
        if (!game.raceWinner) {
          if (game.player1.score >= game.goal) game.raceWinner = game.player1.name;
          else if (game.player2 && game.player2.score >= game.goal) game.raceWinner = game.player2.name;
        }
      }
      
      if (game.collectiveGoal && game.collectiveScore >= game.collectiveGoal) {
        game.collectiveComplete = true;
      }
      
      if (game.mode === GAME_MODES.COLLECTIVE) {
        if (game.collectiveComplete) { game.winner = 'Team'; game.status = 'completed'; }
      } else if (game.collectiveGoal) {
        if (game.raceWinner && game.collectiveComplete) { game.winner = game.raceWinner; game.status = 'completed'; }
      } else {
        if (game.raceWinner) { game.winner = game.raceWinner; game.status = 'completed'; }
      }
      
      if (game.mode === GAME_MODES.VERSUS && game.hasTimer && game.endTime && new Date() >= new Date(game.endTime)) {
        if (!game.raceWinner) {
          game.raceWinner = game.player1.score > (game.player2?.score || 0) ? game.player1.name : 
                    game.player2 && game.player2.score > game.player1.score ? game.player2.name : 'Tie';
        }
        game.winner = game.raceWinner;
        game.status = 'completed';
      }
    }

    function saveGame() {
      localStorage.setItem('fitness_games', JSON.stringify(state.games));
      localStorage.setItem('active_game_id', state.activeGameId || '');

    function formatTime(endTime) {
      const diff = new Date(endTime) - new Date();
      if (diff <= 0) return "Time's up!";
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);
      if (days > 0) return `${days}d ${hours}h ${mins}m left`;
      if (hours > 0) return `${hours}h ${mins}m ${secs}s left`;
      if (mins > 0) return `${mins}m ${secs}s left`;
      return `${secs}s left`;
    }

    function formatDuration(ms) {
      if (!ms) return 'No timer';
      const days = Math.floor(ms / (1000 * 60 * 60 * 24));
      const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
      let parts = [];
      if (days > 0) parts.push(`${days} day${days > 1 ? 's' : ''}`);
      if (hours > 0) parts.push(`${hours} hr${hours > 1 ? 's' : ''}`);
      if (mins > 0) parts.push(`${mins} min${mins > 1 ? 's' : ''}`);
      return parts.join(' ') || 'No timer';
    }

    // ============== VENICE AI PARSER ==============
    async function parseWithVenice(speech, playerNames) {
      if (!state.settings.veniceKey) return { success: false, error: 'no_api_key' };

      const systemPrompt = `You are a smart fitness assistant. Parse the user's speech and return JSON.

Players in this game: ${playerNames.join(', ')}

RULES:
1. Match player names FUZZILY - "William" = Liam, "Dave" = David, "to"/"two" = Player 2
2. NEVER return 0 points - if unsure, ask for clarification
3. Understand natural numbers: "fifty" = 50, "a hundred" = 100

POINTS:
- Push-ups: 1 pt each
- Pull-ups: 4 pts each
- Squats: 1 pt each
- Running: 7 pts/min
- Walking: 2 pts/min
- Plank: 5 pts/min
- Weightlifting: 5 pts/min
- General workout: 5 pts/min

INTENSITY: light=0.75x, normal=1x, intense=1.5x

Return JSON:
{"player":"name","activity":"what","details":"description","intensity":"normal","points":50}

If unclear, return:
{"needsClarification":true,"question":"What did you need?"}`;

      try {
        const response = await fetch('https://api.venice.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.settings.veniceKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: speech }
            ],
            temperature: 0.3
          })
        });

        if (!response.ok) return { success: false, error: 'api_error' };

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || '';
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        
        if (!jsonMatch) return { success: false, error: 'parse_error' };

        const parsed = JSON.parse(jsonMatch[0]);
        
        if (parsed.needsClarification) {
          return { success: false, needsClarification: true, question: parsed.question };
        }
        
        if (!parsed.points || parsed.points === 0) {
          return { success: false, needsClarification: true, question: "How many points should I give for that?" };
        }
        
        return { success: true, data: parsed };
      } catch (err) {
        return { success: false, error: 'network_error' };
      }
    }

    // ============== FUZZY MATCHING ==============
    function fuzzyMatchPlayer(speech, game) {
      const speechLower = speech.toLowerCase();
      const p1 = game.player1.name.toLowerCase();
      const p2 = game.player2?.name.toLowerCase() || '';
      
      const p1Variants = [p1, 'player one', 'player 1', 'first player', 'one', '1'];
      const p2Variants = [p2, 'player two', 'player 2', 'second player', 'two', 'to', 'too', '2'];
      
      for (const v of p1Variants) {
        if (speechLower.includes(v)) return game.player1.name;
      }
      for (const v of p2Variants) {
        if (speechLower.includes(v)) return game.player2.name;
      }
      
      return null;
    }

    function fuzzyMatchPlayerName(input, game) {
      const inputLower = input.toLowerCase();
      const p1 = game.player1.name.toLowerCase();
      const p2 = game.player2?.name.toLowerCase() || '';
      
      if (inputLower === p1 || inputLower === p2) return inputLower === p1 ? game.player1.name : game.player2?.name;
      
      const p1Variants = ['player one', 'player 1', 'one', '1st'];
      const p2Variants = ['player two', 'player 2', 'two', 'to', 'too', '2nd'];
      
      if (p1Variants.includes(inputLower)) return game.player1.name;
      if (p2Variants.includes(inputLower)) return game.player2.name;
      
      return null;
    }
